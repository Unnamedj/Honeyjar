<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Honey Hub — panel de cuentas conectadas</title>
    <meta name="description" content="Dashboard en vivo para el Honey TP Collector: honey total, ritmo, ranking y control remoto de todas tus cuentas.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AF%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="honeycomb-bg"></div>
    <div class="glow glow--a"></div>
    <div class="glow glow--b"></div>

    <main class="auth">
        <div class="auth__card">
            <div class="auth__brand">
                <span class="brand__mark">🍯</span>
                <div>
                    <h1>Honey Hub</h1>
                    <span class="brand__sub">Collector Dashboard</span>
                </div>
            </div>

            <p class="auth__tagline" id="tagline">
                Todas tus cuentas recolectando, en una sola pantalla. Honey total, ritmo por hora,
                ranking y control remoto — y lo tuyo solo lo ves vos.
            </p>

            <div class="notice notice--bad" id="error" hidden></div>
            <div class="notice notice--good" id="success" hidden></div>

            <form id="form" autocomplete="on">
                <div class="field">
                    <label for="username">Usuario</label>
                    <input id="username" name="username" type="text" autocomplete="username"
                           required minlength="3" maxlength="24" placeholder="tu_usuario">
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="current-password"
                           required minlength="8" placeholder="••••••••">
                </div>
                <button class="btn btn--primary" type="submit" id="submit">Entrar</button>
            </form>

            <p class="auth__switch">
                <span id="switch-text">¿Todavía no tenés cuenta?</span>
                <button type="button" id="switch">Creá una</button>
            </p>
        </div>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
