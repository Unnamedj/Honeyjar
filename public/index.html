<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Honey Hub — connected accounts dashboard</title>
    <meta name="description" content="Live dashboard for the Honey TP Collector: total honey, hourly rate, ranking and remote control for all your accounts.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AF%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="honeycomb-bg"></div>
    <div class="glow glow--a"></div>
    <div class="glow glow--b"></div>

    <main class="auth">
        <div class="auth__card">
            <div class="auth__brand">
                <span class="brand__mark">🍯</span>
                <div>
                    <h1>Honey Hub</h1>
                    <span class="brand__sub">Collector Dashboard</span>
                </div>
            </div>

            <p class="auth__tagline" id="tagline">
                Every account of yours collecting, on one screen. Total honey, hourly rate,
                ranking and remote control — and only you see yours.
            </p>

            <div class="notice notice--bad" id="error" hidden></div>
            <div class="notice notice--good" id="success" hidden></div>

            <form id="form" autocomplete="on">
                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username"
                           required minlength="3" maxlength="24" placeholder="your_username">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password"
                           required minlength="8" placeholder="••••••••">
                </div>
                <button class="btn btn--primary" type="submit" id="submit">Sign in</button>
            </form>

            <p class="auth__switch">
                <span id="switch-text">No account yet?</span>
                <button type="button" id="switch">Create one</button>
            </p>
        </div>
    </main>

    <script src="/js/auth.js"></script>
</body>
</html>
